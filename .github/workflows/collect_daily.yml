name: Collect daily activity

on:
  schedule:
    # Every weekday at 22:30 UTC (after US market close + same-day filings settle).
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run daily collector
        env:
          SEC_USER_AGENT: "SPX0DTE-Signals research khurrumtx@gmail.com"
        run: python3 scripts/collect_daily.py

      - name: Commit updated feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- dashboard/daily.json; then
            git add dashboard/daily.json
            git commit -m "Update daily SEC activity feed"
            git push
          else
            echo "No changes to daily.json"
          fi
