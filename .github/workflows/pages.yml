name: Deploy app to GitHub Pages

# Publishes dashboard/ to GitHub Pages and (best-effort) refreshes the daily
# feed first. Auto-enables Pages via configure-pages enablement, so no manual
# Settings toggle is needed. Runs on every push to main, daily, and on demand.

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh daily SEC feed (best-effort)
        continue-on-error: true
        timeout-minutes: 12
        env:
          SEC_USER_AGENT: "SPX0DTE-Signals research khurrumtx@gmail.com"
        run: python3 scripts/collect_daily.py

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - id: deployment
        uses: actions/deploy-pages@v4
